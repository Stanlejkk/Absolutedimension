      rel="apple-touch-icon"
      href="https://www.absolutdimension.com/cdn/shop/files/logo_www_transparent.png?v=1760455149&width=400"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Przemyślana, uporządkowana garderoba zaprojektowana, aby służyć latami. Ponadczasowe sylwetki i szlachetna estetyka."
    />
    <meta property="og:title" content="Absolut Dimension — SM.ART Wardrobe" />
    <meta
      property="og:description"
      content="Przemyślana, uporządkowana garderoba zaprojektowana, aby służyć latami. Ponadczasowe sylwetki i szlachetna estetyka."
    />
    <meta
      property="og:image"
      content="https://www.absolutdimension.com/cdn/shop/files/logo_www_transparent.png?v=1760455149&width=400"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Absolut Dimension — SM.ART Wardrobe" />
    <meta
      name="twitter:description"
      content="Przemyślana, uporządkowana garderoba zaprojektowana, aby służyć latami. Ponadczasowe sylwetki i szlachetna estetyka."
    />
    <meta
      name="twitter:image"
      content="https://www.absolutdimension.com/cdn/shop/files/logo_www_transparent.png?v=1760455149&width=400"
    />
    <!-- Theme color so mobile chrome matches the bone palette -->
    <meta name="theme-color" content="#f4f0ea" />
    <meta name="color-scheme" content="light" />

    <!-- Early connection hints to the hosts we actually hit on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.absolutdimension.com" />

    <!-- Non-render-blocking Google Fonts.
         The <link rel="preload"> warms the cache; the media="print" + onload trick
         lets the CSS download in parallel without blocking first paint. The
         <noscript> fallback preserves the old behaviour for no-JS users. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      />
    </noscript>
  </head>
